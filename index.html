  <link rel="stylesheet" href="mapa-saude-salvador.css">
</head>
<body>

<header>
  <div class="header-brand">
    <div class="brand-icon">🏥</div>
    <div class="brand-text">
      <h1>SaúdeMapa Salvador</h1>
      <span>Rede de Unidades de Saúde — BA</span>
    </div>
  </div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Buscar unidade, bairro ou tipo...">
  </div>

  <div class="stats" id="statsBar">
    <div class="stat-pill"><span class="stat-dot" style="background:var(--hospital)"></span> <span id="countHospital">0</span> Hospitais</div>
    <div class="stat-pill"><span class="stat-dot" style="background:var(--upa)"></span> <span id="countUpa">0</span> UPAs</div>
    <div class="stat-pill"><span class="stat-dot" style="background:var(--ubs)"></span> <span id="countUbs">0</span> UBS/USF</div>
    <div class="stat-pill"><span class="stat-dot" style="background:var(--policlinica)"></span> <span id="countPoli">0</span> Policlínicas</div>
  </div>
</header>

<div class="main">
  <div class="sidebar">
    <div class="filters">
      <div class="filters-title">Filtrar por tipo</div>
      <div class="filter-btns">
        <button class="filter-btn active hospital" data-type="hospital" onclick="toggleFilter(this)">
          <span class="dot" style="background:var(--hospital)"></span> Hospital
        </button>
        <button class="filter-btn active upa" data-type="upa" onclick="toggleFilter(this)">
          <span class="dot" style="background:var(--upa)"></span> UPA 24h
        </button>
        <button class="filter-btn active ubs" data-type="ubs" onclick="toggleFilter(this)">
          <span class="dot" style="background:var(--ubs)"></span> UBS / USF
        </button>
        <button class="filter-btn active policlinica" data-type="policlinica" onclick="toggleFilter(this)">
          <span class="dot" style="background:var(--policlinica)"></span> Policlínica
        </button>
        <button class="filter-btn active maternidade" data-type="maternidade" onclick="toggleFilter(this)">
          <span class="dot" style="background:var(--maternidade)"></span> Maternidade
        </button>
      </div>
    </div>

    <div class="list-header">
      <div class="list-count">Unidades: <span id="visibleCount">0</span></div>
    </div>

    <div class="units-list" id="unitsList"></div>
  </div>

  <div id="map"></div>
</div>

<!-- Info overlay -->
<div class="popup-overlay" id="infoPanel">
  <button class="popup-close" onclick="closePanel()">✕</button>
  <div class="popup-type" id="pType"></div>
  <div class="popup-name" id="pName"></div>
  <div class="popup-row"><span class="ico">📍</span><span id="pAddr"></span></div>
  <div class="popup-row"><span class="ico">🏘️</span><span id="pBairro"></span></div>
  <div class="popup-row" id="pPhoneRow"><span class="ico">📞</span><span id="pPhone"></span></div>
  <div class="popup-row" id="pDistritoRow"><span class="ico">🗺️</span><span id="pDistrito"></span></div>
  <div class="popup-actions">
    <a class="btn-maps" id="pMapsLink" target="_blank">🗺️ Ver no Maps</a>
    <a class="btn-maps" id="pFichaLink" target="_blank" style="display:none; background:linear-gradient(135deg,#9b72ff,#7c4dff);">📋 Ver Ficha</a>
  </div>
</div>

// ─── LEAFLET MAP ──────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true }).setView([-12.9716, -38.5016], 12);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// ─── STATE ────────────────────────────────────────────────────────────────────
let activeFilters = new Set(['hospital','upa','ubs','policlinica','maternidade']);
let searchQuery = '';
let selectedId = null;
const markers = {};

// ─── MARKER ICONS ─────────────────────────────────────────────────────────────
function makeIcon(tipo) {
  const cfg = typeConfig[tipo];
  const html = `<div style="
    width:34px; height:34px;
    background:${cfg.color};
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    display:flex; align-items:center; justify-content:center;
    border:2px solid rgba(255,255,255,0.35);
    box-shadow:0 3px 10px rgba(0,0,0,0.5);
  "><span style="transform:rotate(45deg);font-size:14px;">${cfg.emoji}</span></div>`;
  return L.divIcon({ html, className:'', iconSize:[34,34], iconAnchor:[17,34], popupAnchor:[0,-34] });
}

// ─── BUILD MARKERS ────────────────────────────────────────────────────────────
unidades.forEach(u => {
  const cfg = typeConfig[u.tipo];
  const marker = L.marker([u.lat, u.lng], { icon: makeIcon(u.tipo) });

  marker.bindPopup(`
    <div class="l-popup-type" style="color:${cfg.color}">${cfg.label}</div>
    <div class="l-popup-name">${u.nome}</div>
    <div class="l-popup-addr">📍 ${u.endereco} — ${u.bairro}</div>
    ${u.fichaUrl ? `<div style="margin-top:6px;"><a href="${u.fichaUrl}" target="_blank" style="color:#9b72ff;font-size:12px;font-weight:600;">📋 Ver Ficha do Estabelecimento</a></div>` : ''}
  `);

  marker.on('click', () => showPanel(u.id));
  markers[u.id] = marker;
  marker.addTo(map);
});

// ─── PANEL ────────────────────────────────────────────────────────────────────
function showPanel(id) {
  const u = unidades.find(x => x.id === id);
  if (!u) return;
  const cfg = typeConfig[u.tipo];
  selectedId = id;

  document.getElementById('pType').textContent = cfg.label;
  document.getElementById('pType').style.color = cfg.color;
  document.getElementById('pName').textContent = u.nome;
  document.getElementById('pAddr').textContent = u.endereco;
  document.getElementById('pBairro').textContent = u.bairro;
  document.getElementById('pPhone').textContent = u.telefone || '—';
  document.getElementById('pPhoneRow').style.display = u.telefone ? 'flex' : 'none';
  document.getElementById('pDistrito').textContent = 'Distrito Sanitário ' + u.distrito;
  document.getElementById('pMapsLink').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(u.nome + ' Salvador Bahia')}`;
  const fichaLink = document.getElementById('pFichaLink');
  if (u.fichaUrl) {
    fichaLink.href = u.fichaUrl;
    fichaLink.style.display = 'inline-flex';
  } else {
    fichaLink.style.display = 'none';
  }
  document.getElementById('infoPanel').classList.add('visible');

  // highlight card
  document.querySelectorAll('.unit-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('card-' + id);
  if (card) { card.classList.add('active'); card.scrollIntoView({block:'nearest', behavior:'smooth'}); }

  map.setView([u.lat, u.lng], 15, { animate: true });
  markers[id].openPopup();
}

function closePanel() {
  document.getElementById('infoPanel').classList.remove('visible');
  selectedId = null;
}

// ─── RENDER LIST ──────────────────────────────────────────────────────────────
function renderList() {
  const list = document.getElementById('unitsList');
  const q = searchQuery.toLowerCase();

  const filtered = unidades.filter(u => {
    if (!activeFilters.has(u.tipo)) return false;
    if (q && !u.nome.toLowerCase().includes(q) && !u.bairro.toLowerCase().includes(q) && !typeConfig[u.tipo].label.toLowerCase().includes(q)) return false;
    return true;
  });

  document.getElementById('visibleCount').textContent = filtered.length;

  // Show/hide markers
  unidades.forEach(u => {
    const show = filtered.some(f => f.id === u.id);
    if (show) { if (!map.hasLayer(markers[u.id])) markers[u.id].addTo(map); }
    else { if (map.hasLayer(markers[u.id])) map.removeLayer(markers[u.id]); }
  });

  if (filtered.length === 0) {
    list.innerHTML = `<div class="no-results"><div class="big">🔍</div>Nenhuma unidade encontrada</div>`;
    return;
  }

  list.innerHTML = filtered.map(u => {
    const cfg = typeConfig[u.tipo];
    return `
      <div class="unit-card ${selectedId===u.id?'active':''}" id="card-${u.id}" onclick="showPanel(${u.id}); map.closePopup();">
        <div class="card-top">
          <div class="card-icon" style="background:${cfg.color}22; color:${cfg.color}">${cfg.emoji}</div>
          <div class="card-info">
            <span class="card-type-badge" style="background:${cfg.color}22; color:${cfg.color}">${cfg.label}</span>
            <div class="card-name">${u.nome}</div>
            <div class="card-address">📍 ${u.bairro} · ${u.endereco}</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// ─── FILTERS ─────────────────────────────────────────────────────────────────
function toggleFilter(btn) {
  const tipo = btn.dataset.type;
  if (activeFilters.has(tipo)) {
    if (activeFilters.size <= 1) return; // keep at least one
    activeFilters.delete(tipo);
    btn.classList.remove('active');
  } else {
    activeFilters.add(tipo);
    btn.classList.add('active');
  }
  renderList();
}

// ─── SEARCH ───────────────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderList();
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderList();
</script>
